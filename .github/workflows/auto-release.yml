name: auto-release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch
jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/cargo-auto-release.yml@main
    with:
      # The dispatch input above was DECLARED and never FORWARDED, so an
      # operator choosing `minor`/`major` silently got `patch`. The canonical
      # shim (pleme-io/shikumi) has always carried this line.
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
